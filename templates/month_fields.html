{% set period = start if start is defined else entry_period %}
<label>Month<select name="month_number" required>{% for number, label in [(1,'January'),(2,'February'),(3,'March'),(4,'April'),(5,'May'),(6,'June'),(7,'July'),(8,'August'),(9,'September'),(10,'October'),(11,'November'),(12,'December')] %}<option value="{{ number }}" {{ 'selected' if request.form.get('month_number', period.month)|int == number }}>{{ label }}</option>{% endfor %}</select></label>
<label>Year<select name="year" required>{% set selected_year = request.form.get('year', period.year)|int %}{% for year in range([today.year-20, selected_year]|min, [today.year+6, selected_year+1]|max) %}<option value="{{ year }}" {{ 'selected' if year == selected_year }}>{{ year }}</option>{% endfor %}</select></label>
